server:
  port: 8091

spring:
  datasource:
    url: jdbc:h2:file:./data/vibebox
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

vibebox:
  cors:
    allowed-origins: "http://localhost:*"
